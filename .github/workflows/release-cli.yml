name: release-cli
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x86_64
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select and validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^#define VANTAGE_VERSION "\([^"]*\)"/\1/p' cli/vantage.h)
          tag="v$version"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "$tag" ]]; then
            echo "Tag $REF_NAME does not match CLI version $tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Build and test macOS CLI
        if: runner.os == 'macOS'
        run: make CC=clang -j4 test
      - name: Build and test static Linux CLI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          make CC=musl-gcc LDFLAGS='-static -pthread' -j4 test
      - name: Package CLI and checksum
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          sh tools/package-cli.sh "$RELEASE_TAG"
          test -f "output/cli-release/vantage-$RELEASE_TAG-$PACKAGE_TARGET.tar.gz"
      - name: Test packaged executable through the installer
        run: python3 tests/installer.py --release-dir output/cli-release
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: output/cli-release/*
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: output/cli-release
          merge-multiple: true
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > output/release.json; then
            python3 -c 'import json; assert json.load(open("output/release.json"))["isDraft"], "Refusing to replace a published release"'
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Vantage $RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" output/cli-release/* install.sh --clobber
